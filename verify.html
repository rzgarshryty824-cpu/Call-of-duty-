<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Code - CALL OF DUTY®</title>
    <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,800|Six+Caps&amp;subset=latin,latin" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .main-card {
            background: #141414;
            max-width: 450px;
            width: 100%;
            border-radius: 10px;
            padding: 40px 30px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            border: 1px solid #262626;
            text-align: center;
        }
        .logo-area .cod-logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            font-family: 'Six Caps', 'Arial Black', sans-serif;
            display: block;
            margin-bottom: 10px;
        }
        .verify-icon {
            font-size: 60px;
            margin: 10px 0 15px;
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            background: #1c1c1c;
            border: 2px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus { border-color: #2a6b9e; }
        .input-group input.success { border-color: #4caf50; }
        .input-group input.error { border-color: #d43f3f; }
        .verify-btn {
            background: #f0c040;
            border: none;
            border-radius: 5px;
            color: #1a1a1a;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .verify-btn:hover { background: #d4a830; }
        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-box {
            display: none;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0 10px;
        }
        .result-box.success {
            display: block;
            background: #152a15;
            border: 2px solid #4caf50;
        }
        .result-box.success h3 { color: #7fd17f; font-size: 22px; margin-bottom: 5px; }
        .result-box.success p { color: #aaa; font-size: 14px; }
        .result-box.error {
            display: block;
            background: #2a1515;
            border: 2px solid #d43f3f;
        }
        .result-box.error h3 { color: #ff6b6b; font-size: 22px; margin-bottom: 5px; }
        .result-box.error p { color: #aaa; font-size: 14px; }
        .result-box .cp-display {
            font-size: 28px;
            font-weight: 800;
            color: #f0c040;
            margin: 10px 0;
        }
        .footer-text {
            color: #555;
            font-size: 11px;
            margin-top: 20px;
            border-top: 1px solid #282828;
            padding-top: 15px;
        }
        .back-link {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            display: inline-block;
            margin-top: 10px;
        }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>

<div class="main-card">

    <div class="logo-area">
        <span class="cod-logo">CALL OF DUTY</span>
    </div>

    <div class="verify-icon">🔑</div>

    <h2 style="color: #e8e8e8; font-size: 20px; margin-bottom: 5px;">Verify Your Code</h2>
    <p style="color: #888; font-size: 14px;">Enter the code you received to claim your CP</p>

    <div class="input-group">
        <label for="codeInput">Enter 8-Digit Code</label>
        <input type="text" id="codeInput" maxlength="8" placeholder="XXXXXXXX" autocomplete="off">
    </div>

    <button class="verify-btn" id="verifyBtn">🔓 Verify & Claim</button>

    <div id="resultBox" class="result-box">
        <h3 id="resultTitle"></h3>
        <div class="cp-display" id="resultCP"></div>
        <p id="resultDesc"></p>
    </div>

    <a href="redeem.html" class="back-link">← Back to code</a>

    <div class="footer-text">
        © 2026 Activision Publishing, Inc.
    </div>

</div>

<script>
    // ===== دریافت کد اصلی از localStorage =====
    const originalCode = localStorage.getItem('redeem_code') || '00000000';
    const originalCP = localStorage.getItem('redeem_cp') || '0';

    const codeInput = document.getElementById('codeInput');
    const verifyBtn = document.getElementById('verifyBtn');
    const resultBox = document.getElementById('resultBox');
    const resultTitle = document.getElementById('resultTitle');
    const resultCP = document.getElementById('resultCP');
    const resultDesc = document.getElementById('resultDesc');

    // ===== محدود کردن ورودی به عدد =====
    codeInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
    });

    // ===== تابع تایید =====
    function verifyCode() {
        const enteredCode = codeInput.value.trim();

        if (!enteredCode) {
            codeInput.classList.add('error');
            resultBox.className = 'result-box error';
            resultTitle.textContent = '❌ Invalid Code';
            resultCP.textContent = '';
            resultDesc.textContent = 'Please enter your 8-digit code.';
            resultBox.style.display = 'block';
            return;
        }

        if (enteredCode === originalCode) {
            // کد درست - موفقیت
            codeInput.classList.remove('error');
            codeInput.classList.add('success');
            resultBox.className = 'result-box
